name: Apply current database refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/refactor_current_database.py'
      - '.github/workflows/apply-current-database-refactor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply refactor
        run: python .github/scripts/refactor_current_database.py

      - name: Validate Python syntax
        run: |
          python -m py_compile system/model/Process4MapControl.py
          python -m py_compile system/data_opts/DataClientMain.py
          python -m py_compile system/data_opts/DataHandler.py
          python -m py_compile system/model/config/database_schema.py
          python -m py_compile system/model/config/process4map_config.py

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add system/model/Process4MapControl.py system/data_opts/DataClientMain.py system/data_opts/DataHandler.py system/model/config/process4map_config.py
          git commit -m "Refactor current database persistence"
          git push origin HEAD:main
