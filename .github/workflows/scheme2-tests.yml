name: Scheme2 MFAC Tests

on:
  push:
    branches:
      - codex/scheme2-mfac-v1
  workflow_dispatch:

jobs:
  scheme2-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install Scheme2 test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==1.26.4 \
            pandas==2.3.3 \
            scipy==1.10.1 \
            scikit-learn==1.3.1 \
            joblib==1.3.2 \
            SQLAlchemy==1.4.22 \
            psycopg2-binary==2.9.10

      - name: Run Scheme2 unittest suite
        run: |
          python -m unittest discover -s tests -p 'test_scheme2_*.py' -v
