name: FAST integration refactor

on:
  push:
    paths:
      - 'tools/refactor_fast_change_integration.py'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime smoke dependencies
        run: python -m pip install --quiet numpy pandas
      - name: Apply refactor/fixes
        run: python tools/refactor_fast_change_integration.py
      - name: Compile changed modules
        run: |
          python -m compileall -q \
            system/model/map_control/fast_change_mode \
            system/model/map_control/slurry_policy_model \
            system/model/map_control/condition_model/online_condition_classifier.py \
            system/model/config/database_schema.py
      - name: Run FAST runtime smoke
        run: |
          python - <<'PY'
          import pandas as pd

          from system.model.map_control.fast_change_mode import FastChangeHistoryManager
          from system.model.map_control.slurry_policy_model.slurry_policy_online.fast_action_envelope import (
              build_fast_action_envelope,
          )
          from system.model.map_control.slurry_policy_model.slurry_policy_online.candidate_filter import CandidateFilter
          from system.model.map_control.slurry_policy_model.slurry_policy_online.types import (
              Candidate,
              ConditionContext,
              ControlDemand,
              RealtimeState,
          )

          plant = {
              'outlet_so2_safe_range': [0.0, 35.0],
              'condition_axes': [
                  {'column': 'axis_a', 'min': 0.0, 'max': 100.0, 'step': 10.0},
                  {'column': 'axis_b', 'min': 0.0, 'max': 1000.0, 'step': 100.0},
              ],
              'towers': [
                  {
                      'tower_id': 't1',
                      'enabled': True,
                      'ph_column': 'ph1',
                      'ph_safe_range': [5.0, 6.0],
                      'ph_guard_band': 0.1,
                      'valves': [
                          {
                              'valve_id': 'v1',
                              'column': 'v1_open',
                              'min_opening': 0.0,
                              'max_opening': 100.0,
                              'action_threshold': 0.5,
                          }
                      ],
                      'supply_pumps': [],
                  }
              ],
          }
          manager = FastChangeHistoryManager(plant_config=plant)
          rows = []
          start = pd.Timestamp('2026-01-01 00:00:00')
          for i in range(12):
              rows.append({
                  'date': start + pd.Timedelta(seconds=30 * i),
                  'axis_a': float(i * 4),
                  'axis_b': float(100 + i * 35),
                  'jyq_SO2': 20.0 + 0.05 * i,
                  'outlet_so2_target': 20.0,
              })
          annotated = manager.annotate_dataframe(pd.DataFrame(rows))
          assert (annotated['fast_change_mode'] == 'FAST_CHANGE').any(), annotated[['date', 'fast_change_mode']]
          checkpoint = manager.export_checkpoint()
          resumed = FastChangeHistoryManager(plant_config=plant)
          resumed.load_checkpoint(checkpoint)
          next_context = resumed.evaluate_online({
              'date': start + pd.Timedelta(seconds=30 * 12),
              'axis_a': 52.0,
              'axis_b': 530.0,
              'jyq_SO2': 21.0,
              'outlet_so2_target': 20.0,
          })
          assert next_context['fast_change_input_valid'] is True

          demand = ControlDemand(
              commanded_target=20.0,
              effective_target=20.0,
              current_so2=20.0,
              error=0.0,
              demand_level='TARGET_HOLD',
              desired_so2_response='SO2_HOLD',
              acceptable_effect_directions=['NEUTRAL'],
              maximum_action_magnitude='HOLD',
              safety_level='NORMAL',
          )
          fast_context = {
              'fast_change_mode': 'FAST_CHANGE',
              'fast_change_direction': 'RISE',
              'fast_change_effect_state': 'TARGET_BAND',
              'fast_change_effect_risk_level': 'LOW',
              'fast_change_outlet_so2_trend': 'RISING_FAST',
              'fast_change_exact_trend_mode': 'AXIS1_AND_AXIS2_RISE_FAST',
          }
          online = {
              'fast_policy': {
                  'allow_preemptive_increase': True,
                  'target_band_preemptive_max_magnitude': 'SMALL',
                  'combined_rise_max_magnitude': 'MEDIUM',
                  'minimum_transient_safe_ratio': 0.85,
                  'minimum_transient_rate_reduction': -0.10,
              },
              'profile_acceptance': {
                  'local_allowed_status': ['SUPPORTED'],
                  'neighbor_allowed_status': ['SUPPORTED'],
                  'transient_allowed_status': ['SUPPORTED'],
                  'plant_prior_allowed_status': ['SUPPORTED'],
                  'minimum_direction_consistency': 0.55,
                  'minimum_safety_history_score': 80.0,
                  'minimum_reliability_total_score': 45.0,
                  'minimum_stable_response_ratio': 0.50,
                  'allow_mixed_action': False,
                  'allow_rebalance_action': False,
              },
          }
          envelope = build_fast_action_envelope(fast_context, demand, online)
          assert 'INCREASE' in envelope.allowed_slurry_directions
          assert 'DECREASE' not in envelope.allowed_slurry_directions
          assert envelope.maximum_action_magnitude == 'MEDIUM'

          state = RealtimeState(
              timestamp='2026-01-01T00:06:00',
              condition=ConditionContext(
                  condition_snapshot_version='v001',
                  condition_label='C1',
                  condition_stable=False,
                  condition_valid=True,
              ),
              process={'jyq_SO2': 20.0, 'ph1': 5.5, 'v1_open': 50.0},
              load_rate=8.0,
              inlet_so2_rate=70.0,
              outlet_so2_rate=1.0,
              disturbance_mode='AXIS1_AND_AXIS2_RISE_FAST',
              control_mode='FAST_CHANGE',
              fast_context=fast_context,
              policy_state_key='TRANSIENT',
              policy_state_key_no_grid='TRANSIENT',
          )
          rule = Candidate(
              source='FAST_RULE_BASELINE',
              owner_id='FAST_RULE',
              state_key='TRANSIENT',
              action_id='TOWER:t1|SUPPLY|INCREASE|SMALL',
              profile={
                  'action_profile': {
                      'action_family': 'TOWER:t1|SUPPLY',
                      'direction': 'INCREASE',
                      'magnitude': 'SMALL',
                      'representative_delta': {},
                  },
                  'so2_effect': {'dominant_direction': 'DECREASE', 'direction_consistency': 0.0},
                  'stability': {'stable_response_ratio': 0.0},
                  'safety': {'any_safety_violation_ratio': 0.0},
                  'reliability': {'total_score': 0.0, 'safety_history_score': 0.0},
                  'profile_status': 'RULE',
              },
              source_priority=2,
              synthetic=True,
          )
          accepted, rejected = CandidateFilter(plant, online).filter(
              [rule],
              state,
              ControlDemand(
                  commanded_target=20.0,
                  effective_target=20.0,
                  current_so2=20.0,
                  error=0.0,
                  demand_level='TARGET_HOLD',
                  desired_so2_response='SO2_HOLD',
                  acceptable_effect_directions=['DECREASE'],
                  maximum_action_magnitude='MEDIUM',
                  safety_level='NORMAL',
              ),
              {},
              {'reverse_lock_active': False},
              envelope,
          )
          assert accepted and not rejected, rejected
          print('FAST runtime smoke passed')
          PY
      - name: Validate diff and retired duplicate FAST code
        run: |
          git diff --check
          ! grep -R "DisturbanceMonitor" system/model/map_control/slurry_policy_model/slurry_policy_online --include='*.py'
          ! test -f system/model/map_control/slurry_policy_model/_engine/disturbance_classifier.py
          ! grep -R "calibrate_disturbance_thresholds" system/model/map_control/slurry_policy_model --include='*.py'
      - name: Commit refactor
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden FAST lifecycle and policy integration'
          git push origin HEAD:main
