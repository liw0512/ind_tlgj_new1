name: Core condition axes and topology tests

on:
  push:
    branches: [main]
    paths:
      - 'system/model/config/**'
      - 'system/model/map_control/condition_model/**'
      - 'system/model/map_control/slurry_policy_model/**'
      - '.github/workflows/core-condition-axes-tests.yml'
  pull_request:
    paths:
      - 'system/model/config/**'
      - 'system/model/map_control/condition_model/**'
      - 'system/model/map_control/slurry_policy_model/**'
      - '.github/workflows/core-condition-axes-tests.yml'
  workflow_dispatch:

jobs:
  configurable-condition-axes-and-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core test dependencies
        run: python -m pip install --upgrade pip numpy==1.26.4 pandas==2.3.3

      - name: Test unified plant configuration source
        run: python -m system.model.config.test_unified_plant_config

      - name: Test condition model one/two arbitrary axes
        run: python -m system.model.map_control.condition_model.test.test_configurable_condition_axes

      - name: Test condition model optional tower pH
        run: python -m system.model.map_control.condition_model.test.test_optional_tower_ph

      - name: Test policy model one/two arbitrary axes
        run: python -m system.model.map_control.slurry_policy_model.test_configurable_condition_axes

      - name: Test policy model single/dual tower topology
        run: python -m system.model.map_control.slurry_policy_model.test_configurable_tower_topology

      - name: Test fixed-speed supply pump availability
        run: python -m system.model.map_control.slurry_policy_model.test_supply_pump_availability
