name: Core model regression tests

on:
  push:
    branches: [main]
    paths:
      - 'system/model/config/**'
      - 'system/model/map_control/condition_model/**'
      - 'system/model/map_control/slurry_policy_model/**'
      - '.github/workflows/core-condition-axes-tests.yml'
  pull_request:
    paths:
      - 'system/model/config/**'
      - 'system/model/map_control/condition_model/**'
      - 'system/model/map_control/slurry_policy_model/**'
      - '.github/workflows/core-condition-axes-tests.yml'
  workflow_dispatch:

jobs:
  core-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core test dependencies
        run: python -m pip install --upgrade pip numpy==1.26.4 pandas==2.3.3

      - name: Test unified plant configuration source
        run: python -m system.model.config.test_unified_plant_config

      - name: Test condition model core regression
        run: python -m system.model.map_control.condition_model.tests.test_core_regression

      - name: Test slurry policy core regression
        run: python -m system.model.map_control.slurry_policy_model.tests.test_core_regression
