name: Apply standard field naming refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/refactor_standard_field_names.py'
      - '.github/workflows/apply-standard-field-refactor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core dependencies
        run: python -m pip install --upgrade pip numpy==1.26.4 pandas==2.3.3

      - name: Pre-refactor reference audit
        shell: bash
        run: |
          echo '=== config.condition_axes references ==='
          grep -RIn 'condition_axes' system/model/map_control/condition_model --include='*.py' || true
          echo '=== grid_definition references ==='
          grep -RIn 'grid_definition' system/model/map_control/condition_model --include='*.py' || true

      - name: Patch one-shot helper safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/refactor_standard_field_names.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '    lines[target.lineno - 1:target.end_lineno] = [code]\n',
              '    start_lineno = target.lineno\n'
              '    decorators = getattr(target, "decorator_list", None) or []\n'
              '    if decorators:\n'
              '        start_lineno = min([start_lineno, *[item.lineno for item in decorators]])\n'
              '    lines[start_lineno - 1:target.end_lineno] = [code]\n',
          )
          s = s.replace(
              '    source = source.replace("AxisConfig(", "ConditionAxisConfig(")\n'
              '    # Undo the constructor replacements already intentionally using the 4-argument new class is not needed.\n',
              '',
          )
          s = s.replace(
              'ast.parse(path.read_text(encoding="utf-8"), filename=str(path))',
              'ast.parse(path.read_text(encoding="utf-8-sig"), filename=str(path))',
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply refactor
        run: python .github/scripts/refactor_standard_field_names.py

      - name: Finish fixed target field migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('system/model/map_control/condition_model/condition_config.py')
          s = p.read_text(encoding='utf-8')
          marker = 'from system.model.config.plant_config import PLANT_CONFIG as SITE_PLANT_CONFIG\n'
          standard_import = 'from system.model.config.standard_fields import TARGET_SO2_COLUMN\n'
          if standard_import not in s:
              s = s.replace(marker, marker + standard_import)
          s = s.replace(
              '"target_column": str(_PROCESS_COLUMNS["target_so2"]),',
              '"target_column": TARGET_SO2_COLUMN,',
          )
          if '_PROCESS_COLUMNS' in s:
              raise SystemExit('retired _PROCESS_COLUMNS still exists after migration')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Compile current model code
        run: python -m compileall -q system/model system/data_opts

      - name: Smoke test standard interface and snapshot migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from system.model.config.standard_fields import (
              TIME_COLUMN, OUTLET_SO2_COLUMN, LIQUID_GAS_RATIO_COLUMN, TARGET_SO2_COLUMN,
          )
          assert (TIME_COLUMN, OUTLET_SO2_COLUMN, LIQUID_GAS_RATIO_COLUMN, TARGET_SO2_COLUMN) == (
              'date', 'jyq_SO2', 'liquid_gas_ratio', 'outlet_so2_target'
          )

          from system.model.map_control.condition_model.condition_config import default_config, from_dict
          cfg = default_config()
          assert len(cfg.condition_axes) in (1, 2)
          assert all(axis.column for axis in cfg.condition_axes)
          assert cfg.to_dict().get('data_columns') is None
          assert cfg.to_dict().get('grid_definition') is None

          legacy_cfg = from_dict({
              'grid_definition': {
                  'jzfh': {'min': 100, 'max': 200, 'step': 10},
                  'yyq_SO2': {'min': 500, 'max': 1500, 'step': 100},
              },
              'data_columns': {
                  'xst_ph': 'xstjy_PH',
                  'apt_ph': 'aptjy_PH',
              },
              'emission_limit': 35,
          })
          assert legacy_cfg.condition_axis_columns == ('jzfh', 'yyq_SO2')
          assert legacy_cfg.tower_ph_columns[:2] == ('xstjy_PH', 'aptjy_PH')

          from system.model.map_control.condition_model.condition_schema import GridCell
          legacy_cell = GridCell.from_dict({
              'grid_id': 'P1-S1',
              'load_level': 1,
              'inlet_so2_level': 1,
              'load_range': [100, 110],
              'inlet_so2_range': [500, 600],
              'statistics': {'mean_liquid_gas': 8.0, 'mean_net_so2': 20.0},
              'accumulators': {'numeric': {'liquid_gas': {'count': 1, 'sum': 8.0, 'sum_square': 64.0, 'minimum': 8.0, 'maximum': 8.0}}},
          })
          assert legacy_cell.axis_1_level == 1 and legacy_cell.axis_2_level == 1
          assert 'load_level' not in legacy_cell.to_dict()

          from system.model.map_control.condition_model.initial_condition_builder import InitialConditionBuilder
          row = {
              LIQUID_GAS_RATIO_COLUMN: 8.0,
              OUTLET_SO2_COLUMN: 20.0,
          }
          for axis in cfg.condition_axes:
              row[axis.column] = (axis.minimum + axis.maximum) / 2.0
          for ph_column in cfg.tower_ph_columns:
              row[ph_column] = 5.2
          snap = InitialConditionBuilder(cfg).build([row], 'v001')
          populated = [cell for cell in snap.grid_catalog.values() if cell.sample_count]
          assert len(populated) == 1
          cell = populated[0]
          assert f'mean_{LIQUID_GAS_RATIO_COLUMN}' in cell.statistics
          assert f'mean_{OUTLET_SO2_COLUMN}' in cell.statistics
          assert all(not key.startswith('mean_xst_ph') for key in cell.statistics)

          from system.model.map_control.condition_model.incremental_condition_updater import IncrementalConditionUpdater
          updated = IncrementalConditionUpdater(cfg).update(snap, [row], 'v002')
          assert sum(cell.sample_count for cell in updated.grid_catalog.values()) == 2

          # If repository snapshots exist, make sure an old published snapshot still loads.
          from system.model.map_control.condition_model.snapshot_io import read_snapshot
          candidates = sorted(Path('system/model/map_control/condition_model/snapshots').glob('v*/condition_snapshot.json'))
          if candidates:
              existing = read_snapshot(str(candidates[-1]))
              from_dict(existing.grid_config)

          from system.model.map_control.slurry_policy_model.slurry_policy_config import PLANT_CONFIG
          from system.model.map_control.slurry_policy_model._engine.config_loader import validate_plant_config
          validate_plant_config(PLANT_CONFIG)
          from system.model.map_control.slurry_policy_model._engine.schema import OUTLET_SO2_COLUMN as POLICY_OUTLET, time_column
          assert POLICY_OUTLET == 'jyq_SO2'
          assert time_column(PLANT_CONFIG) == 'date'

          from system.model.config.slurry_core_bridge_config import SLURRY_CORE_BRIDGE_CONFIG
          assert SLURRY_CORE_BRIDGE_CONFIG['target_column'] == 'outlet_so2_target'
          print('standard field naming smoke tests passed')
          PY

      - name: Reject retired aliases from active configuration code
        shell: bash
        run: |
          if grep -RIn 'process_columns' system/model --include='*.py'; then
            echo 'process_columns alias still exists' >&2
            exit 1
          fi
          if grep -RIn 'LEGACY_CONDITION_AXIS_COLUMNS' system/model --include='*.py'; then
            echo 'legacy condition axis constant still exists' >&2
            exit 1
          fi
          if grep -RInE 'DEFAULT_DATA_COLUMNS|class DataColumnConfig' system/model --include='*.py'; then
            echo 'retired data column alias config still exists' >&2
            exit 1
          fi
          if grep -RInE '\.(load_column|inlet_so2_column)\b|\.load\b|\.inlet_so2\b' system/model/map_control/condition_model --include='*.py' | grep -v 'json.load'; then
            echo 'retired axis object aliases still exist' >&2
            exit 1
          fi
          if grep -RInE 'load_level|inlet_so2_level|load_range|inlet_so2_range' system/model/map_control/condition_model --include='*.py' | grep -vE 'Historical|legacy_axis_fields|"load_|"inlet_so2_'; then
            echo 'retired grid-cell aliases still exist outside migration' >&2
            exit 1
          fi

      - name: Commit generated changes
        shell: bash
        run: |
          git checkout -- .github/scripts/refactor_standard_field_names.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A system/model system/data_opts .github/workflows/core-condition-axes-tests.yml
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'Standardize model field and axis naming'
          git push origin HEAD:main
